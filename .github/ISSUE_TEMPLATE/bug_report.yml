name: Bug report
description: Report reproducible application or logger behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, hostnames, private paths, and confidential trace data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Source mode
      options: [Local/offline, SSH/rsync live, Logger, macOS build, Linux build]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description and reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
