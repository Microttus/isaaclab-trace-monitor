[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab-trace-monitor"
version = "1.3.0"
description = "Live and offline desktop monitor for Isaac Lab object trajectory logs"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Martin Økter"},
]
keywords = [
    "isaaclab",
    "robotics",
    "reinforcement-learning",
    "trajectory",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PySide6-Essentials>=6.8.2,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.12",
]
build = [
    "pyinstaller==6.22.1",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/Microttus/isaaclab-trace-monitor"
Repository = "https://github.com/Microttus/isaaclab-trace-monitor"
Issues = "https://github.com/Microttus/isaaclab-trace-monitor/issues"
Changelog = "https://github.com/Microttus/isaaclab-trace-monitor/blob/main/CHANGELOG.md"
"AI assistance disclosure" = "https://github.com/Microttus/isaaclab-trace-monitor/blob/main/AI_ASSISTANCE.md"

[project.scripts]
isaaclab-trace-monitor = "isaaclab_trace_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
isaaclab_trace_monitor = [
    "assets/*.png",
    "assets/*.icns",
    "assets/licenses/*.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
